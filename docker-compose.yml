services:
  new-mir:
    build:
      context: .
      dockerfile: Dockerfile
    image: new-mir:latest
    container_name: new-mir
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      NEW_MIR_HOST: "0.0.0.0"
      NEW_MIR_PORT: "8000"
      NEW_MIR_LOG_LEVEL: "info"
      # HuggingFace cache — points to the persisted volume so GPT-2
      # weights are downloaded only once and survive container restarts.
      HF_HOME: "/app/data/models"
      TRANSFORMERS_CACHE: "/app/data/models"
      # Persistent state directory — training_stats.json, saved model
      # weights (neural_core.json) and cell snapshots (cells.json) live
      # here.  Backed by the new_mir_state volume so they survive both
      # container restarts AND image rebuilds.
      NEW_MIR_STATE_DIR: "/app/data/state"
      # Background distillation scheduler settings.
      # NEW_MIR_DISTILL_INTERVAL: seconds between cycles (default 1800 = 30 min)
      # NEW_MIR_DISTILL_NEW:      new GPT-2 examples per cycle (default 5)
      # NEW_MIR_DISTILL_REPLAY:   replay buffer examples per cycle (default 10)
      NEW_MIR_DISTILL_INTERVAL: "60"
      NEW_MIR_DISTILL_NEW: "5"
      NEW_MIR_DISTILL_REPLAY: "10"
    # Resource limits — tuned for ~70 % CPU utilisation on a typical server.
    # Raise cpus further if the host has more cores to spare.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: "4g"
        reservations:
          cpus: "0.5"
          memory: "512m"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      # 120s allows GPT-2 to download on first run before health checks start failing
      start_period: 120s
    volumes:
      # Persists GPT-2 / HuggingFace model weights between container restarts.
      # Seed data (data/seed/) is embedded in the image and never re-downloaded.
      - new_mir_models:/app/data/models
      # Persists training state (training_stats.json), saved neural weights
      # (weights/neural_core.json) and cell snapshots (weights/cells.json).
      # Unlike source code, these survive both restarts AND image rebuilds.
      - new_mir_state:/app/data/state

volumes:
  new_mir_models:
  new_mir_state:
