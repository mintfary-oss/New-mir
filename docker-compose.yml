services:
  new-mir:
    build:
      context: .
      dockerfile: Dockerfile
    image: new-mir:latest
    container_name: new-mir
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      NEW_MIR_HOST: "0.0.0.0"
      NEW_MIR_PORT: "8000"
      NEW_MIR_LOG_LEVEL: "info"
      # HuggingFace cache — points to the persisted volume so GPT-2
      # weights are downloaded only once and survive container restarts.
      HF_HOME: "/app/data/models"
      TRANSFORMERS_CACHE: "/app/data/models"
      # Persistent state directory — training_stats.json, saved model
      # weights (neural_core.json) and cell snapshots (cells.json) live
      # here.  Backed by the new_mir_state volume so they survive both
      # container restarts AND image rebuilds.
      NEW_MIR_STATE_DIR: "/app/data/state"
      # Background distillation scheduler settings.
      NEW_MIR_DISTILL_INTERVAL: "60"
      NEW_MIR_DISTILL_NEW: "5"
      NEW_MIR_DISTILL_REPLAY: "10"
    # ── Resource limits ────────────────────────────────────────────────────
    # These are DEFAULTS for manual use.  When installed via install.sh, a
    # docker-compose.override.yml is generated automatically with limits
    # tuned to your actual hardware (CPU cores, RAM, GPU).
    #
    # GPU support: install.sh adds NVIDIA GPU device reservation here
    # automatically when nvidia-container-toolkit is detected.
    deploy:
      resources:
        limits:
          cpus: "1.0"     # override: install.sh sets this to 50% of your CPUs
          memory: "2g"    # override: install.sh sets this to 80% of your RAM
        reservations:
          cpus: "0.25"
          memory: "512m"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      # 120s allows GPT-2 to download on first run before health checks start failing
      start_period: 120s
    volumes:
      # Persists GPT-2 / HuggingFace model weights between container restarts.
      - new_mir_models:/app/data/models
      # Persists training state, saved neural weights and cell snapshots.
      - new_mir_state:/app/data/state

volumes:
  new_mir_models:
  new_mir_state:
